<!DOCTYPE html>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; width: 100%; font-family: 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif; background: #000; overflow: hidden; }

.loading-cover {
  position: fixed; inset: 0; z-index: 1000;
  background: #1a1a2e;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  transition: opacity .8s;
}
.loading-cover.hide { opacity: 0; pointer-events: none; }
.loading-cover .frame {
  background: #2a2a3e; border-radius: 16px 16px 0 0;
  width: 720px; max-width: 90vw; overflow: hidden; box-shadow: 0 8px 40px rgba(0,0,0,.5);
}
.loading-cover .bar {
  background: #3a3a4e; padding: 12px 16px;
  display: flex; align-items: center; gap: 10px;
}
.loading-cover .dots { display: flex; gap: 7px; }
.loading-cover .dots span { width: 12px; height: 12px; border-radius: 50%; }
.loading-cover .dots span:nth-child(1) { background: #ff5f57; }
.loading-cover .dots span:nth-child(2) { background: #ffbd2e; }
.loading-cover .dots span:nth-child(3) { background: #28c840; }
.loading-cover .addr {
  flex: 1; background: #1a1a2e; padding: 7px 14px; border-radius: 6px;
  font-size: 14px; color: #ccc; font-family: monospace; min-height: 32px;
}
.loading-cover .hint {
  color: rgba(255,255,255,.4); font-size: 13px; margin-top: 20px;
}

.main-page {
  position: fixed; inset: 0; display: flex; flex-direction: column;
  opacity: 0; transition: opacity .8s;
}
.main-page.show { opacity: 1; }

.bg-cover {
  position: absolute; inset: 0; z-index: 0;
  background: linear-gradient(180deg, rgba(0,0,0,.40) 0%, rgba(0,0,0,.15) 50%, rgba(0,0,0,.60) 100%),
    url('https://cn.bing.com/th?id=OHR.NavajoNation_ZH-CN9274387505_1920x1080.webp') center/cover no-repeat;
}
.bg-gradient {
  position: absolute; inset: 0; z-index: 1;
  background: linear-gradient(180deg, rgba(0,77,64,.25) 0%, transparent 40%, rgba(0,77,64,.35) 100%);
}

header {
  position: relative; z-index: 10;
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 32px;
}
header .left { display: flex; align-items: center; gap: 28px; }
header nav { display: flex; gap: 22px; }
header nav a { color: rgba(255,255,255,.8); text-decoration: none; font-size: 14px; cursor: default; }
header nav a:hover { color: #fff; }
header .right { display: flex; align-items: center; gap: 14px; color: rgba(255,255,255,.7); font-size: 13px; }
header .right .signin { color: #fff; padding: 5px 14px; border: 1px solid rgba(255,255,255,.35); border-radius: 4px; }

.center {
  position: relative; z-index: 10;
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 0 32px 10vh;
}

.sbox {
  width: 100%; max-width: 600px;
  background: #fff; border-radius: 8px;
  display: flex; align-items: center;
  box-shadow: 0 4px 20px rgba(0,0,0,.25);
}
.sbox:focus-within { box-shadow: 0 4px 30px rgba(0,0,0,.35); }
.sbox .mag { padding: 0 0 0 16px; color: #888; font-size: 16px; }
.sbox input {
  flex: 1; border: none; padding: 14px 10px;
  font-size: 16px; outline: none; font-family: inherit; color: #333;
}
.sbox .gobtn {
  background: #0078d4; color: #fff; border: none;
  padding: 14px 28px; font-size: 15px; cursor: pointer;
  font-family: inherit; transition: .3s;
  opacity: .6; pointer-events: none;
}
.sbox .gobtn.enabled { opacity: 1; pointer-events: auto; }
.sbox .gobtn.enabled:hover { background: #106ebe; }

.guide {
  position: relative; z-index: 10; text-align: center;
  margin-top: 28px; min-height: 76px; line-height: 1.8;
  font-size: 22px; color: #fff;
  text-shadow: 0 1px 10px rgba(0,0,0,.6);
  max-width: 640px;
}
.guide .tag {
  display: inline-block; background: #0078d4;
  padding: 4px 18px; border-radius: 20px;
  font-size: 15px; font-weight: 700; margin-right: 10px;
}
.guide .hl {
  font-weight: 600; background: rgba(255,255,255,.15);
  padding: 2px 14px; border-radius: 6px;
  border: 1px solid rgba(255,255,255,.2);
}
.guide small {
  display: block; font-size: 15px;
  color: rgba(255,255,255,.5); margin-top: 8px; text-shadow: none;
}

.suggestions {
  position: relative; z-index: 10;
  display: flex; flex-wrap: wrap; gap: 10px;
  margin-top: 18px; justify-content: center;
}
.suggestions span {
  background: rgba(255,255,255,.1); color: rgba(255,255,255,.7);
  padding: 6px 18px; border-radius: 18px;
  font-size: 14px; cursor: pointer; transition: .2s;
  border: 1px solid rgba(255,255,255,.08);
}
.suggestions span:hover { background: rgba(255,255,255,.2); color: #fff; }

.step-dots {

}
.step-dots .dot {
  width: 36px; height: 4px; border-radius: 2px;
  background: rgba(255,255,255,.2); transition: .8s;
}
.step-dots .dot.active { background: #fff; width: 50px; }
.step-dots .dot .lbl {

  font-size: 11px; color: rgba(255,255,255,.3); margin-top: 6px;

.step-dots .dot.active .lbl { color: rgba(255,255,255,.7); }

.redirect-note { position: relative; z-index: 10; margin-top: 16px; font-size: 14px; color: rgba(255,255,255,.45); display: none; }

@keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes pulseBtn { 0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(0,120,212,.5)} 50%{transform:scale(1.06);box-shadow:0 0 20px 6px rgba(0,120,212,.3)} }

  let i = 0;
  function t() {
    if (i < text.length) {

      setTimeout(t, speed + Math.random() * (speed * 0.5));

function isCN(c) { return c >= '\u4e00' && c <= '\u9fff'; }
function getPy(c) { return pyMap[c] || (isCN(c) ? '??' : null); }

// Fallback pinyin pool for characters not in the map (keeps IME demo realistic)
const fallbackPy = ['zi','zhong','sheng','feng','rui','ming','an','wei','yu','guang','qin','yi','lan','ning','chen','jing','bo','fang','hao','yuan','ke','xuan','ling','jun','jie','ruo','yan','sen']; 
function getPinyinFor(ch) {
  const p = getPy(ch);
  if (p !== '??') return p;
  let h = 0;
  for (let i = 0; i < ch.length; i++) h = (h * 31 + ch.charCodeAt(i)) >>> 0;
  return fallbackPy[h % fallbackPy.length];
}

// Pinyin IME simulation
function imeType(query, onDone) {
  let pos = 0;
  const items = [];
  for (const ch of query) {
    const py = getPy(ch);
    if (py) items.push({ ch, py: getPinyinFor(ch) });
    else items.push({ ch, py: null });
  }

  function next() {
    if (pos >= items.length) { if (onDone) onDone(); return; }
    const it = items[pos];
    const prefix = query.slice(0, pos);
    if (!it.py) {
      input.value = prefix + it.ch;
      pos++;
      setTimeout(next, 150 + Math.random() * 100);
    } else {
      const py = it.py;
      let pi = 0;
      const t = setInterval(() => {
        if (pi < py.length) {
          input.value = prefix + py.slice(0, pi + 1);
          input.scrollLeft = input.scrollWidth;
          pi++;
        } else {
          clearInterval(t);
          setTimeout(() => {
            input.value = prefix + it.ch;
            input.scrollLeft = input.scrollWidth;
            pos++;
            setTimeout(next, 150);
          }, 300);
        }
      }, 100);
    }
  }
  next();
}

// Query param (base64)
const qParam = (() => {
  const v = new URLSearchParams(location.search).get('q');
  if (!v) return null;
  try {
    let b64 = v.replace(/\s/g, '+');
    return decodeURIComponent(escape(atob(b64)));
  } catch { return null; }
})();

// Execute search
function doSearch() {
  const q = input.value.trim();
  if (!q) return;

  // No param: redirect to self with base64-encoded query to start auto-play demo
  if (!qParam) {
    const b64 = btoa(unescape(encodeURIComponent(q)));
    window.location.href = '?q=' + b64;
    return;
  }

  // Has param: auto-play flow with button click animation + taunt overlay
  setStep(3);
  showGuide('<span class="tag">第三步</span>点击搜索 <span class="hl">"' + q + '"</span>');
  goBtn.classList.remove('enabled');
  suggestions.style.display = 'none';

  goBtn.style.transition = 'transform .1s, background .1s';
  goBtn.style.transform = 'scale(.92)';
  goBtn.style.background = '#005a9e';
  setTimeout(() => {
    goBtn.style.transform = '';
    goBtn.style.background = '';
    goBtn.style.transition = '';
  }, 200);

  setTimeout(() => {
    showTauntOverlay(q);
  }, 800);
}

function showTauntOverlay(q) {
  const overlay = document.createElement('div');
  overlay.id = 'tauntOverlay';
  overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:fi .5s';
  overlay.innerHTML = `
    <div style="font-size:clamp(24px,5vw,48px);color:#ff2222;font-weight:900;text-align:center;line-height:1.8;text-shadow:0 0 40px rgba(255,0,0,.4),0 0 80px rgba(255,0,0,.2);max-width:90vw;letter-spacing:2px;animation:pulseText 2s ease-in-out infinite">
      这对于你而言<br>就是如此的困难吗？
    </div>
    <div style="margin-top:30px;font-size:14px;color:rgba(255,255,255,.25)">点击任意处跳转搜索结果</div>
  `;
  // Add keyframe for pulseText if not exists
  if (!document.getElementById('pulseKeyframes')) {
    const s = document.createElement('style');
    s.id = 'pulseKeyframes';
    s.textContent = '@keyframes pulseText { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.85;transform:scale(1.04)} } @keyframes fi { from{opacity:0} to{opacity:1} }';
    document.head.appendChild(s);
  }
  overlay.onclick = function() {
    document.body.removeChild(overlay);
    window.location.href = 'https://cn.bing.com/search?q=' + encodeURIComponent(q);
  };
  setTimeout(() => {
    if (document.getElementById('tauntOverlay')) {
      document.body.removeChild(overlay);
      window.location.href = 'https://cn.bing.com/search?q=' + encodeURIComponent(q);
    }
  }, 5000);
  document.body.appendChild(overlay);
}

// Auto play
function autoPlay(query) {
  autoPlaying = true;
  const url = 'https://cn.bing.com';

  // Step 1: type URL in loading cover (>= 3s)
  typeText(addrBar, url, 130, () => {
    loadingCover.classList.add('hide');
    mainPage.classList.add('show');
    setStep(1);
    showGuide('<span class="tag">第一步</span>打开 <span class="hl">Bing</span> 搜索网站');

    // Step 2: type query with pinyin IME
    setTimeout(() => {
      setStep(2);
      showGuide('<span class="tag">第二步</span>输入想要搜索的关键词 <span class="hl">"' + query + '"</span> <small>在搜索框中输入你想查的内容</small>');
      input.focus();

      imeType(query, () => {
        setStep(2);
        goBtn.classList.add('enabled');
        showGuide('<span class="tag">第二步</span>关键词已输入 <span class="hl">"' + query + '"</span> <small>现在点击搜索按钮</small>');
        // Pulse the button
        goBtn.style.animation = 'pulseBtn 1s ease-in-out 3';
        // Auto-click after 3s
        setTimeout(() => {
          goBtn.style.animation = '';
          doSearch();
        }, 3500);
      });
    }, 1000);
  });
}

// Events
input.addEventListener('focus', () => {
  if (autoPlaying) return;
  if (step === 1) { setStep(2); showGuide('<span class="tag">第二步</span>在搜索框中输入搜索关键词'); }
});
input.addEventListener('input', () => { if (!autoPlaying) goBtn.classList.toggle('enabled', input.value.trim().length > 0); });
input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && input.value.trim() && !autoPlaying) doSearch(); });
goBtn.addEventListener('click', doSearch);
suggestions.addEventListener('click', (e) => {
  if (e.target.tagName !== 'SPAN') return;
  input.value = e.target.textContent;
  goBtn.classList.add('enabled');
  if (step === 1) { setStep(2); showGuide('<span class="tag">第二步</span>在搜索框中输入搜索关键词'); }
  input.focus();
});

// Init
if (qParam) {
  autoPlay(qParam);
} else {
  typeText(addrBar, 'https://cn.bing.com', 60, () => {
    loadingCover.classList.add('hide');
    mainPage.classList.add('show');
    setStep(1);
    showGuide('<span class="tag">第一步</span>打开 <span class="hl">Bing</span> 搜索网站，开始输入关键词吧');
  });
}
</script>
